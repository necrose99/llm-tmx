[build-system]
requires = ["hatchling", "hatch-cython"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython"]
src = ["src/llm_tmx"]

[project]
name = "llm-tmx"
dynamic = ["version"]
description = "A streaming, bi-directional translation middleware converting TMX, XLIFF, and i18n JSON data to LLM JSONL lines on-the-fly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
[project.optional-dependencies]
# Isolated ML pipeline hooks - loaded strictly on demand by down-stream frameworks
training = [
    "datasets>=2.0.0",     # For zero-copy, direct memory-mapped dataset streaming
    "transformers>=4.20.0", # Basic tokenizing validation safety checks
    "torch"
]

# Maps a terminal alias ('llm-tmx') straight to your internal Python functions
[project.scripts]
llm-tmx = "llm_tmx.cli:main"

[tool.hatch.version]
path = "src/llm_tmx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tmx"]
